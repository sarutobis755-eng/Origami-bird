let bgOk=false;bg.onload=()=>bgOk=true;
let state='ready',score=0,best=0,bgx=0,t=0,spawnT=1,overT=0,muted=false,shake=0;
try{best=+localStorage.getItem('ob_best')||0}catch(e){}
const bird={x:230,y:270,vy:0,flap:0,rot:0};
let planes=[],bits=[];

/* ---------- audio ---------- */
let ac=null,windG=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    const len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    noiseBuf=b;
    const s=ac.createBufferSource();s.buffer=b;s.loop=true;
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
    windG=ac.createGain();windG.gain.value=muted?0:0.035;
    s.connect(f);f.connect(windG);windG.connect(ac.destination);s.start();
  }catch(e){ac=null}
}
let noiseBuf=null;
function tone(type,f0,f1,dur,vol,delay=0){
  if(!ac||muted)return;
  const o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.001,n+dur);
  o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+dur+0.02);
}
function noise(dur,vol,freq,type='highpass'){
  if(!ac||muted||!noiseBuf)return;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain(),n=ac.currentTime;
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.001,n+dur);
  s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n,Math.random());s.stop(n+dur);
}
const sFlap=()=>{noise(0.1,0.18,2500);tone('triangle',360,640,0.09,0.12)};
const sScore=()=>{tone('sine',880,880,0.12,0.13);tone('sine',1320,1320,0.18,0.12,0.08)};
const sHit=()=>{noise(0.45,0.4,900,'lowpass');tone('sawtooth',240,50,0.4,0.18)};
const sStart=()=>{tone('sine',523,523,0.1,0.1);tone('sine',784,784,0.15,0.1,0.09)};

/* ---------- game flow ---------- */
function reset(){
  bird.y=270;bird.vy=0;bird.rot=0;score=0;planes=[];bits=[];spawnT=1.2;
}
function flap(){
  initAudio();
  if(state==='ready'){reset();state='play';sStart()}
  else if(state==='over'){if(overT>0.5){reset();state='play';sStart()}return}
  bird.vy=-430;bird.flap=0.18;aph=0;sFlap();
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)flap()}
  else if(e.code==='KeyM'){muted=!muted;if(windG)windG.gain.value=muted?0:0.035}
});
function toggleMute(){muted=!muted;if(windG)windG.gain.value=muted?0:0.035}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();if(e.clientX>r.right-60&&e.clientY<r.top+60){initAudio();toggleMute();return}flap()});

function mk(x,y,s,sp,dark){const k=W<600?0.8:1,w=(dark?118:150)*s*k,h=w*(dark?0.469:0.316);return{x,y,s,sp,dark,im:dark?SP.planeG:SP.planeW,w,h,done:false,ph:Math.random()*6}}
function spawn(){
  const sp=Math.min(250+score*5,520)*(W<600?0.78:1),s=0.8+Math.random()*0.55,y=70+Math.random()*(H-140);
  const dark=Math.random()<0.35;
  planes.push(mk(W+120,y,s,sp,dark));
  if(score>4&&Math.random()<0.4){
    const y2=y+(Math.random()<0.5?-1:1)*(170+Math.random()*60);
    if(y2>50&&y2<H-50)planes.push(mk(W+200+Math.random()*120,y2,0.8+Math.random()*0.4,sp,!dark));
  }
}
function die(){
  state='over';overT=0;shake=0.3;sHit();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  for(let i=0;i<22;i++)bits.push({x:bird.x,y:bird.y,vx:(Math.random()-0.5)*420,vy:(Math.random()-0.8)*380,r:Math.random()*6,vr:(Math.random()-0.5)*12,life:1.2});
  if(score>best){best=score;try{localStorage.setItem('ob_best',best)}catch(e){}}
}

function update(dt){
  t+=dt;bgx=(bgx+(state==='play'?42:20)*dt);
  if(state!=='over')aph+=dt*(bird.flap>0?24:7);else aph=2;
  if(bird.flap>0)bird.flap-=dt;
  if(state==='ready'){bird.y=270+Math.sin(t*3)*12;bird.rot=Math.sin(t*3)*0.05;return}
  if(state==='play'){
    bird.vy=Math.min(bird.vy+1500*dt,720);bird.y+=bird.vy*dt;
    bird.rot+=((Math.max(-0.5,Math.min(1.0,bird.vy/600)))-bird.rot)*Math.min(1,dt*10);
    if(bird.y<14){bird.y=14;bird.vy=0}
    if(bird.y>H-14)return die();
    spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=Math.max(0.85,1.6-score*0.02)+Math.random()*0.3}
    for(const p of planes){
      p.x-=p.sp*dt;
      const py=p.y+Math.sin(t*2+p.ph)*10,w=p.w,h=p.h;
      const dx=(bird.x-p.x)/(w*0.4+14),dy=(bird.y-py)/(h*0.4+14);
      if(dx*dx+dy*dy<1)return die();
      if(!p.done&&p.x+w/2<bird.x-16){p.done=true;score++;sScore()}
    }
    planes=planes.filter(p=>p.x>-200);
  }
  if(state==='over'){
    overT+=dt;bird.vy=Math.min(bird.vy+1500*dt,900);bird.y=Math.min(bird.y+bird.vy*dt,H+60);bird.rot+=dt*6;
    for(const p of planes)p.x-=p.sp*dt*0.3;
  }
  for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=900*dt;b.r+=b.vr*dt;b.life-=dt}
  bits=bits.filter(b=>b.life>0);
  if(shake>0)shake-=dt;
}

/* ---------- drawing ---------- */
function poly(pts,fill,stroke){
  g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);
  g.closePath();g.fillStyle=fill;g.fill();
  if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}
}

const SEQ=['A','B','C','D'];
function drawBird(){
  const im=SP[SEQ[((Math.floor(aph)%4)+4)%4]],k=W<600?0.42:0.52;
  if(!im.complete||!im.naturalWidth)return;
  g.save();g.translate(bird.x,bird.y);g.rotate(bird.rot);
  g.drawImage(im,-123*k,-150*k,im.naturalWidth*k,im.naturalHeight*k);
  g.restore();
}
function drawPlane(p){
  if(!p.im.complete||!p.im.naturalWidth)return;
  const py=p.y+Math.sin(t*2+p.ph)*10;
  g.save();g.translate(p.x,py);g.rotate(Math.sin(t*2+p.ph)*0.04);
  g.drawImage(p.im,-p.w/2,-p.h/2,p.w,p.h);g.restore();
}
function txt(s,x,y,size,col='#0b3a52'){size=W<600?size*0.62:size;
  g.font=`800 ${size}px "Trebuchet MS",Verdana,sans-serif`;g.textAlign='center';
  g.lineWidth=size/6;g.strokeStyle='#ffffffcc';g.lineJoin='round';g.strokeText(s,x,y);
  g.fillStyle=col;g.fillText(s,x,y);
}
function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-0.5)*10,(Math.random()-0.5)*10);
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#0a9bd6');gr.addColorStop(0.25,'#0a9bd6');gr.addColorStop(0.7,'#9ad3d8');gr.addColorStop(1,'#f1f0e6');
  g.fillStyle=gr;g.fillRect(-20,-20,W+40,H+40);
  if(bgOk){
    const iw=bg.width*H/bg.height,o=-(bgx%iw);
    for(let x=o;x<W;x+=iw)g.drawImage(bg,x,0,iw,H);
  }
  planes.forEach(drawPlane);
  if(state!=='over'||bird.y<H+50)drawBird();
  for(const b of bits){g.save();g.globalAlpha=Math.min(1,b.life);g.translate(b.x,b.y);g.rotate(b.r);
    poly([[-6,-6],[7,-3],[-2,7]],'#ee5fa6');g.restore()}
  g.restore();
  g.font='26px sans-serif';g.textAlign='right';g.fillStyle='#fff';g.fillText(muted?'🔇':'🔊',W-12,36);
  if(state==='play')txt(score,W/2,70,56);
  if(state==='ready'){
    if(W<600){txt('ORIGAMI',W/2,190,66);txt('BIRD',W/2,255,66)}else txt('ORIGAMI BIRD',W/2,200,72);
    txt(W<600?'Tap to fly':'Press SPACE to fly',W/2,400,34);
    txt(W<600?'Dodge the paper planes':'Dodge the paper planes  ·  M = mute',W/2,445,22);
  }
  if(state==='over'){
    txt('Crashed!',W/2,200,70);
    txt('Score '+score+'   Best '+best,W/2,275,38);
    if(overT>0.5)txt(W<600?'Tap to retry':'Press SPACE to try again',W/2,400,32);
  }
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():ac.resume()});
let last=performance.now();
function loop(n){
  const dt=Math.max(0,Math.min(0.033,(n-last)/1000));last=n;
  try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
